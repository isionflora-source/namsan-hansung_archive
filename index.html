<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>남산도서관 서포터즈 아카이브</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500&family=Noto+Serif+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#FFF8E7;--ink:#12284B;--ink2:#4d6585;--line:rgba(18,40,75,.14);
  --paper:rgba(255,253,246,.97);--glass:rgba(255,255,255,.55);--hover:rgba(18,40,75,.06);
  --b1:#8CC1E9;--b2:#438BC4;--b3:#FFE3A6;--b1o:.75;--b2o:.42;--b3o:.85;
  --c-card:#0055A0;--c-exh:#438BC4;--c-vid:#12284B;--c-int:#8CC1E9;--c-edu:#2c7a92;--c-etc:#6a7f9c;
  --serif:'Noto Serif KR','Nanum Myeongjo',serif;
  --sans:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --ease:cubic-bezier(.22,.9,.24,1);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#08172e;--ink:#FFF8E7;--ink2:#a7bdd8;--line:rgba(255,248,231,.17);
    --paper:rgba(11,28,54,.97);--glass:rgba(18,40,75,.5);--hover:rgba(255,248,231,.08);
    --b1:#0055A0;--b2:#438BC4;--b3:#12284B;--b1o:.8;--b2o:.32;--b3o:.95;
    --c-vid:#2b5a9c;--c-etc:#5d7390;--c-edu:#2c7a92;
  }
}
:root[data-theme="dark"]{
  --bg:#08172e;--ink:#FFF8E7;--ink2:#a7bdd8;--line:rgba(255,248,231,.17);
  --paper:rgba(11,28,54,.97);--glass:rgba(18,40,75,.5);--hover:rgba(255,248,231,.08);
  --b1:#0055A0;--b2:#438BC4;--b3:#12284B;--b1o:.8;--b2o:.32;--b3o:.95;
  --c-vid:#2b5a9c;--c-etc:#5d7390;--c-edu:#2c7a92;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;font-family:var(--sans);color:var(--ink);line-height:1.65;-webkit-font-smoothing:antialiased}
*,*::before,*::after{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
[hidden]{display:none!important}

/* animated background + pointer parallax */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--bg)}
.bgi{position:absolute;inset:-6%;transform:translate3d(calc(var(--px,0)*-26px),calc(var(--py,0)*-20px),0);transition:transform .9s var(--ease)}
.blob{position:absolute;width:80vmax;height:80vmax;border-radius:50%}
.blob.a{left:-24vmax;top:-30vmax;background:radial-gradient(circle,var(--b1) 0%,transparent 62%);opacity:var(--b1o);animation:da 28s ease-in-out infinite alternate}
.blob.b{right:-30vmax;top:6vmax;background:radial-gradient(circle,var(--b2) 0%,transparent 62%);opacity:var(--b2o);animation:db 34s ease-in-out infinite alternate}
.blob.c{left:2vmax;bottom:-46vmax;background:radial-gradient(circle,var(--b3) 0%,transparent 62%);opacity:var(--b3o);animation:dc 40s ease-in-out infinite alternate}
@keyframes da{to{transform:translate(30vmax,20vmax) scale(1.2)}}
@keyframes db{to{transform:translate(-28vmax,14vmax) scale(.85)}}
@keyframes dc{to{transform:translate(24vmax,-16vmax) scale(1.15)}}

.wrap{max-width:1520px;margin:0 auto;padding:26px 28px 72px}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;font-size:13px;color:var(--ink2)}
.orgs{display:flex;align-items:center;gap:18px}
.orgs .x{font-size:15px;opacity:.55}
.logo{display:block;background:var(--ink);opacity:.92;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat;aspect-ratio:var(--ar)}
.logo.ns{height:36px}
.logo.hs{height:46px}
.theme{border:1px solid var(--line);background:var(--glass);border-radius:999px;padding:5px 14px;font-size:12px;backdrop-filter:blur(10px);transition:background .2s}
.theme:hover{background:var(--hover)}
.hero{padding:44px 0 34px}
.hero h1{font-family:var(--serif);font-weight:500;font-size:clamp(34px,5.6vw,64px);line-height:1.16;margin:0 0 14px;letter-spacing:-.015em}
.hero p{margin:0;max-width:36em;font-size:16px;color:var(--ink2)}

.layout{display:grid;grid-template-columns:244px minmax(0,1fr);gap:34px;align-items:start}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 18px);max-height:calc(100vh - 36px);overflow:auto;display:flex;flex-direction:column;gap:22px;padding:18px;border:1px solid var(--line);border-radius:18px;background:var(--glass);backdrop-filter:blur(16px);scrollbar-width:thin}
.fl{margin:0 0 8px 2px;font-size:12px;color:var(--ink2)}
.seg{display:flex;padding:3px;border-radius:999px;background:rgba(127,150,180,.18)}
.seg button{flex:1;border:0;background:transparent;padding:7px 10px;border-radius:999px;font-size:13px;transition:background .3s,color .3s}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.opts{display:flex;flex-direction:column;gap:2px}
.opt{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:transparent;border-radius:10px;padding:7px 10px;font-size:14px;transition:background .2s,transform .2s}
.opt:hover{background:var(--hover);transform:translateX(3px)}
.opt[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.opt .n{margin-left:auto;font-size:12px;opacity:.65;font-variant-numeric:tabular-nums}
.opt .d{width:9px;height:9px;border-radius:50%;background:var(--fc);flex:none}
.opt[aria-pressed="true"] .d{outline:1.5px solid var(--bg)}
.opt.zero{opacity:.5}
.kws{display:flex;flex-wrap:wrap;gap:5px}
.kw{border:1px solid var(--line);background:transparent;border-radius:999px;padding:3px 11px;font-size:12.5px;transition:background .2s,border-color .2s}
.kw:hover{border-color:var(--ink)}
.kw[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:9px 16px;font:inherit;font-size:14px;width:100%}
.search::placeholder{color:var(--ink2)}
.rand{border:1px solid var(--ink);background:transparent;border-radius:999px;padding:9px 16px;font-size:14px;transition:background .25s,color .25s,transform .25s}
.rand:hover{background:var(--ink);color:var(--bg);transform:translateY(-2px)}
.count{font-size:13px;color:var(--ink2);margin:0 2px}
.count b{font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}

/* groups */
.group{margin-top:54px}
.group:first-child{margin-top:0}
.gh{display:flex;align-items:baseline;gap:14px;margin:0 2px 2px}
.gh h2{font-family:var(--serif);font-weight:500;font-size:clamp(28px,3.4vw,40px);margin:0;display:flex;align-items:center;gap:12px;line-height:1.2}
.gh h2 i{width:14px;height:14px;border-radius:50%;background:var(--fc);display:inline-block}
.gh span{font-size:13px;color:var(--ink2)}
.row{display:flex;gap:5px;height:660px;padding-top:16px}

/* folders */
.f{position:relative;flex:0 0 54px;min-width:0;border-radius:16px;background:var(--fc);color:var(--on);transition:flex .7s var(--ease),transform .35s var(--ease),box-shadow .35s;box-shadow:0 1px 0 rgba(255,255,255,.18) inset,0 10px 24px -14px rgba(18,40,75,.55)}
.f::before{content:"";position:absolute;top:-11px;left:9px;width:32px;height:14px;border-radius:8px 8px 0 0;background:var(--fc)}
.f:nth-child(even)::before{left:auto;right:9px}
.f:nth-child(3n)::before{left:50%;right:auto;transform:translateX(-50%)}
.f.open{flex:1 1 0}
.f:not(.open):hover{transform:translateY(-9px);box-shadow:0 1px 0 rgba(255,255,255,.2) inset,0 22px 30px -14px rgba(18,40,75,.6)}
.f:not(.open)::after{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(150px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.3),transparent 70%);opacity:0;transition:opacity .3s;pointer-events:none}
.f:not(.open):hover::after{opacity:1}
.intro .f{animation:rise .8s var(--ease) both;animation-delay:calc(var(--i)*55ms)}
@keyframes rise{from{opacity:0;transform:translateY(36px)}to{opacity:1;transform:none}}
.t-card{--fc:var(--c-card);--on:#FFF8E7}
.t-exh{--fc:var(--c-exh);--on:#fff}
.t-vid{--fc:var(--c-vid);--on:#FFF8E7}
.t-int{--fc:var(--c-int);--on:#12284B}
.t-edu{--fc:var(--c-edu);--on:#FFF8E7}
.t-etc{--fc:var(--c-etc);--on:#FFF8E7}
.strip{position:absolute;inset:0;border:0;background:transparent;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:18px 0;transition:opacity .25s}
.f.open .strip{opacity:0;pointer-events:none}
.vt{writing-mode:vertical-rl;font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-height:520px;letter-spacing:.01em}
.dt{font-size:11px;opacity:.8;font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.f .strip:focus-visible{outline-color:#fff;outline-offset:-4px}

.paper{position:absolute;inset:8px;border-radius:11px;background:var(--paper);color:var(--ink);opacity:0;visibility:hidden;transform:translateY(18px);transition:opacity .25s,transform .25s,visibility 0s .25s;container-type:size;overflow:hidden}
.f.open .paper{opacity:1;visibility:visible;transform:none;transition:opacity .55s .28s var(--ease),transform .7s .28s var(--ease)}
.pin{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0;height:100%}
.info{padding:34px 30px 28px 34px;overflow:auto;display:flex;flex-direction:column;gap:18px;scrollbar-width:thin}
.info>*{opacity:0;transform:translateY(10px)}
.f.open .info>*{opacity:1;transform:none;transition:opacity .5s var(--ease),transform .6s var(--ease);transition-delay:calc(.42s + var(--k,0)*60ms)}
.series{font-size:13px;color:var(--ink2);margin:0}
.info h3{font-family:var(--serif);font-weight:500;font-size:clamp(24px,4.6cqw,36px);line-height:1.38;margin:4px 0 0;letter-spacing:-.01em;word-break:keep-all;overflow-wrap:break-word;text-wrap:balance}
.info h3.m{font-size:clamp(22px,3.9cqw,30px);line-height:1.42}
.info h3.l{font-size:clamp(20px,3.3cqw,26px);line-height:1.46}
.info h3 .t2{display:block;margin-top:.5em;font-size:.68em;font-weight:400;color:var(--ink2);line-height:1.5}
dl{display:grid;grid-template-columns:5.6em 1fr;gap:9px 14px;margin:0;font-size:14px}
dt{color:var(--ink2)}
dd{margin:0;overflow-wrap:anywhere}
.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:0 10px;font-size:12.5px;margin:0 5px 5px 0}
.sub{margin:0;font-size:12.5px;color:var(--ink2)}
.kws.in .kw{font-size:12.5px}
.lks{display:flex;flex-direction:column;gap:10px}
.lk{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;text-align:left;border:0;background:var(--c-card);color:#fff;border-radius:16px;padding:16px 22px;text-decoration:none;box-shadow:0 10px 20px -12px rgba(0,85,160,.85);transition:background .3s,transform .35s var(--ease),box-shadow .3s}
.lk:hover{background:var(--c-vid);transform:translateX(6px);box-shadow:0 14px 24px -12px rgba(18,40,75,.8)}
.lk .l1{font-size:15.5px;font-weight:500}
.lk .l2{font-size:12px;opacity:.78;white-space:nowrap}
.lk.off{border-style:dashed;border-color:var(--line);color:var(--ink2);cursor:default}
.lk.off:hover{background:transparent;color:var(--ink2);transform:none}
.orig{display:flex;flex-wrap:wrap;gap:6px;padding:2px 2px 4px}
.orig[hidden]{display:none}
.orig a{border:1px solid var(--line);border-radius:999px;padding:3px 13px;font-size:12.5px;text-decoration:none;transition:background .2s,color .2s,border-color .2s}
.orig a:hover{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.orig.on{animation:fade .45s both}
.ccl{font-size:12px;color:var(--ink2);margin:0;margin-top:auto}
.share{border:0;background:transparent;padding:0;font-size:12.5px;color:var(--ink2);text-decoration:underline;text-underline-offset:3px;align-self:flex-start}

.empty{margin-top:18px;padding:34px;border:1px dashed var(--line);border-radius:16px;text-align:center;color:var(--ink2);font-size:14px}
.foot{margin-top:64px;font-size:12px;color:var(--ink2)}

@container (max-width:620px){
  .pin{grid-template-columns:1fr;grid-template-rows:auto auto;align-content:start;overflow:auto}
  .info{overflow:visible}
  .info:first-child{padding-bottom:4px;gap:16px}
  .info+.info{padding-top:20px}
}
@media (max-width:1040px){
  .layout{grid-template-columns:1fr;gap:24px}
  .side{position:static;max-height:none;flex-direction:row;flex-wrap:wrap;gap:18px 26px}
  .side>div{min-width:210px;flex:1}
  .opts{flex-direction:row;flex-wrap:wrap}
  .opt{width:auto}
  .opt:hover{transform:none}
}
@media (max-width:760px){
  .wrap{padding:18px 16px 56px}
  .hero{padding:30px 0 22px}
  .row{flex-direction:column;height:auto;padding-top:14px}
  .f,.f.open{flex:none}
  .f:not(.open):hover{transform:none}
  .strip{position:relative;flex-direction:row;height:56px;padding:0 20px;width:100%}
  .vt{writing-mode:horizontal-tb;max-height:none;max-width:78%}
  .f.open .strip{opacity:1;pointer-events:auto}
  .paper{position:relative;inset:auto;margin:0 8px 8px;display:none;opacity:1;visibility:visible;transform:none;container-type:normal}
  .f.open .paper{display:block;animation:fade .5s both}
  .pin{display:block;height:auto}
  .info{overflow:visible;padding:22px 20px 8px}
  .info>*{opacity:1;transform:none}
  dl{grid-template-columns:5.2em 1fr}
}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  .blob,.intro .f,.f.open .paper,.orig.on{animation:none!important}
  .f,.paper,.strip,.info>*,.bgi,.lk{transition:none!important}
}
</style>
</head>

function clean(u){
  if(!u)return "";u=String(u).trim();
  if(/^https:\/\/www\.instagram\.com\/p\//.test(u))return u.split("?")[0];
  return u;
}
function linkInfo(u){
  if(/instagram\.com/.test(u))return "인스타그램에서 보기";
  if(/youtu/.test(u))return "유튜브에서 보기";
  if(/nslib\.sen\.go\.kr/.test(u))return "남산도서관 홈페이지에서 보기";
  if(/drive\.google\.com\/drive\/folders/.test(u))return "원본 이미지 폴더 열기";
  if(/drive\.google\.com/.test(u))return "원본 이미지 열기";
  return "결과물 보기";
}

function dots(s){return s.replace(/(\d{4})\.\s*(\d{1,2})\.\s*(\d{1,2})\.?/g,function(_,y,m,d){return y+"."+("0"+m).slice(-2)+"."+("0"+d).slice(-2)+"."})}
function issue(r){
  var raw=r["원본 소식지 호수"]||"",per=r["소식지 발행 시기"]||"";
  if(!raw&&!per)return null;
  var re=/(제?\d+(?:[~\-]\d+)?호|창간호)\s*(?:\(([\d.\s]+)\))?/g,m,nums=[],ds=[];
  while((m=re.exec(raw))){nums.push(m[1]);ds.push(m[2]?dots(m[2].trim()):"")}
  if(!nums.length&&raw)nums=[raw];
  var times;
  if(ds.some(function(x){return x})){
    var parts=per.split(/,\s*/);
    times=parts.length===nums.length?parts.map(function(p,i){return p+(ds[i]?"("+ds[i]+")":"")}):[per];
  }else{
    times=per?[dots(per.replace(/\s*\/\s*/g,", "))]:[];
  }
  return {nums:nums.join(", "),times:times.join(", ")};
}
var E=RAW.map(function(r,i){

  e.home=null;e.sns=null;e.orig=[];

    if(/nslib\.sen\.go\.kr/.test(u)){if(!e.home)e.home={url:u,host:"nslib.sen.go.kr"}}
    else if(/instagram\.com/.test(u)){if(!e.sns)e.sns={url:u,label:"인스타그램",host:"instagram.com"}}

  (r._slides||[]).forEach(function(id,i){e.orig.push({url:view(id),label:(r._photos?"카드뉴스 ":"")+(i+1)+"장"})});

function match(e,skip){
  if(skip!=="year"&&S.year!=="all"&&e["활동 연도"]!=S.year)return false;

  if(S.q&&(e["제목"]+" "+(e["제작자"]||"")).toLowerCase().indexOf(S.q.toLowerCase())<0)return false;
  return true;
}

  YEARS.forEach(function(y){var n=cnt(function(e){return e["활동 연도"]===y&&match(e,"year")});h+=opt("year",y,y,n,"")});
  h+='</div></div><div><p class="fl">자료 유형</p><div class="opts">'+opt("type","all","전체",cnt(function(e){return match(e,"type")}),"");
  TYPES.forEach(function(t){var n=cnt(function(e){return e["자료 유형"].indexOf(t)>-1&&match(e,"type")});if(n||S.type===t)h+=opt("type",t,t,n,TCLS[t])});
  h+='</div></div><div><p class="fl">주제 키워드</p><div class="kws">';
  KWS.forEach(function(k){h+='<button class="kw" type="button" data-kw="'+esc(k)+'" aria-pressed="'+(S.kw===k)+'">'+esc(k)+'</button>'});
  h+='</div></div><input class="search" id="q" type="search" placeholder="제목이나 제작자 검색" aria-label="검색" value="'+esc(S.q)+'">';
  h+='<button class="rand" type="button" data-act="random">아무거나 열어보기</button><p class="count" id="count" aria-live="polite"></p>';
  var q=document.activeElement&&document.activeElement.id==="q";
  document.getElementById("side").innerHTML=h;
  if(q){var i=document.getElementById("q");i.focus();i.setSelectionRange(i.value.length,i.value.length)}
}
function opt(k,v,label,n,cls){
  var cur=S[k]===v||(k==="year"&&S.year==v&&v!=="all");
  return '<button class="opt '+cls+(n?"":" zero")+'" type="button" data-'+k+'="'+v+'" aria-pressed="'+cur+'">'+(cls?'<i class="d"></i>':"")+'<span>'+label+'</span><span class="n">'+n+'</span></button>';
}

/* ---------- main ---------- */
function list(){return E.filter(function(e){return match(e)}).sort(function(a,b){var x=(a["게시일"]||""),y=(b["게시일"]||"");return x<y?-1:x>y?1:a.id<b.id?-1:1})}
function titleHTML(e){
  var t=e.title,m=/^(.+?):\s+(.+)$/.exec(t),len=t.length,c=len>38?"l":len>22?"m":"";
  var h=m?esc(m[1])+'<span class="t2">'+esc(m[2])+'</span>':esc(t);
  return '<h3 class="'+c+'">'+h+'</h3>';
}
function lk(l,label,host,cls){
  if(!l)return '<span class="lk off"><span class="l1">'+label+'</span><span class="l2">연결된 링크 없음</span></span>';
  return '<a class="lk" href="'+esc(l.url)+'" target="_blank" rel="noopener"><span class="l1">'+label+'</span><span class="l2">'+host+'</span></a>';
}
function links(e){
  var h=e.home?lk(e.home,"남산도서관 홈페이지","nslib.sen.go.kr"):"";
  if(e.orig.length===1)h+=lk(e.orig[0],"원본 링크","Google 드라이브");
  else if(e.orig.length>1)h+='<button class="lk" type="button" data-act="orig" aria-expanded="false"><span class="l1">원본 링크</span><span class="l2">'+e.orig.length+'개 열기</span></button><div class="orig" hidden>'+e.orig.map(function(o){return '<a href="'+esc(o.url)+'" target="_blank" rel="noopener">'+esc(o.label)+'</a>'}).join("")+'</div>';
  if(e.sns)h+=lk(e.sns,e.sns.label,e.sns.host);
  return h?'<div class="lks">'+h+'</div>':"";
}
function folder(e,i,cls,open){
  var au=e["제작자"],rows="";
  if(au)rows+="<dt>제작자</dt><dd>"+esc(au)+"</dd>";
  if(e["게시일"])rows+="<dt>게시일</dt><dd>"+fmt(e["게시일"])+"</dd>";
  if(e["전시 기간"])rows+="<dt>전시 기간</dt><dd>"+esc(e["전시 기간"])+"</dd>";
  if(e["전시 장소"])rows+="<dt>전시 장소</dt><dd>"+esc(e["전시 장소"])+"</dd>";
  if(e["제작완료일"]&&e["게시일"]&&e["제작완료일"]<=e["게시일"])rows+="<dt>제작완료일</dt><dd>"+fmt(e["제작완료일"])+"</dd>";
  rows+="<dt>자료 유형</dt><dd>"+e["자료 유형"].map(function(t){return '<span class="tag">'+esc(t)+"</span>"}).join("")+"</dd>";
  if(e["게시 플랫폼"])rows+="<dt>게시 플랫폼</dt><dd>"+e["게시 플랫폼"].map(function(t){return '<span class="tag">'+esc(t)+"</span>"}).join("")+"</dd>";
  var src="";
  if(e.issue){
    src='<div><p class="fl">원본 소식지</p><dl>'+(e.issue.nums?"<dt>호수</dt><dd>"+esc(e.issue.nums)+"</dd>":"")+(e.issue.times?"<dt>발행 시기</dt><dd>"+esc(e.issue.times)+"</dd>":"")+"</dl></div>";
  }
  var kws=(e["주제 키워드"]||[]).map(function(k){return '<button class="kw" type="button" data-kw="'+esc(k)+'">'+esc(k)+"</button>"}).join("");
  var k=0;function K(){return ' style="--k:'+(k++)+'"'}
  return '<div class="f '+cls+(open?" open":"")+'" data-id="'+e.id+'" style="--i:'+i+'">'
  +'<button class="strip" type="button" aria-expanded="'+(open?"true":"false")+'" aria-label="'+esc(e.title)+' 열기"><span class="dt">'+mmdd(e["게시일"])+'</span><span class="vt">'+esc(e.title)+'</span><span class="dt">'+e["활동 연도"]+'</span></button>'
  +'<article class="paper"><div class="pin"><div class="info">'
  +'<div'+K()+'>'+(e.series?'<p class="series">'+esc(e.series)+"</p>":"")+titleHTML(e)+'</div>'
  +(function(){var l=links(e);return l?'<div'+K()+'>'+l+'</div>':""})()
  +'</div><div class="info">'
  +'<dl'+K()+'>'+rows+'</dl>'
  +(src?'<div'+K()+'>'+src+'</div>':"")
  +'<div'+K()+'><p class="fl">주제 키워드</p><div class="kws in">'+kws+'</div></div>'
  +'<p class="ccl"'+K()+'>'+(e["CCL"]?esc(e["CCL"])+" 라이선스 · ":"")+'<button class="share" type="button" data-act="share">이 활동 링크 복사</button></p>'
  +'</div></div></article></div>';
}
function group(name,items,clsFn,dot){
  var h='<section class="group"><div class="gh"><h2>'+(dot?'<i style="--fc:var(--c-'+({"카드뉴스":"card","영상":"vid","전시":"exh","인터뷰":"int","교육자료":"edu","기타":"etc"}[name])+')"></i>':"")+esc(name)+'</h2><span>'+items.length+'개 활동</span></div><div class="row">';
  var openId=null;items.forEach(function(e){if(openIds[e.id+"|"+name])openId=e.id});
  if(!openId)openId=items[0].id;
  items.forEach(function(e,i){h+=folder(e,i,clsFn(e),e.id===openId)});
  return h+"</div></section>";
}
function render(){
  var l=list(),h="",shown=0;
  if(S.group==="year"){
    YEARS.forEach(function(y){
      if(S.year!=="all"&&S.year!=y)return;
      var it=l.filter(function(e){return e["활동 연도"]===y});
      if(it.length){h+=group(String(y),it,function(e){return TCLS[e["자료 유형"][0]]||"t-etc"},false);shown+=it.length}
      else if(S.type==="all"&&S.kw==="all"&&!S.q)h+='<section class="group"><div class="gh"><h2>'+y+'</h2><span>준비 중</span></div><div class="empty">'+y+'년 활동은 노션 자료가 채워지면 이곳에 나타나요.</div></section>';
    });
  }else{
    TYPES.forEach(function(t){
      var it=l.filter(function(e){return e["자료 유형"].indexOf(t)>-1});
      if(it.length){h+=group(t,it,function(){return TCLS[t]},true);shown+=it.length}
    });
  }
  if(!h)h='<div class="empty">조건에 맞는 활동이 없어요. 필터를 바꾸거나 검색어를 지워 보세요.</div>';
  var app=document.getElementById("app");
  app.className=intro?"intro":"";app.innerHTML=h;intro=false;
  side();count(shown);
}
var lastN=0;
function count(n){
  var el=document.getElementById("count");if(!el)return;
  var from=lastN,t0=performance.now();lastN=n;
  function step(t){var p=Math.min(1,(t-t0)/450),v=Math.round(from+(n-from)*(1-Math.pow(1-p,3)));el.innerHTML="총 <b>"+v+"</b>개 활동";if(p<1)requestAnimationFrame(step)}
  requestAnimationFrame(step);
}

function openFolder(f,focus){
  var row=f.parentNode;
  row.querySelectorAll(".f").forEach(function(o){o.classList.remove("open");o.querySelector(".strip").setAttribute("aria-expanded","false")});
  f.classList.add("open");f.querySelector(".strip").setAttribute("aria-expanded","true");
  var g=row.parentNode.querySelector("h2").textContent;
  Object.keys(openIds).forEach(function(k){if(k.split("|")[1]===g)delete openIds[k]});
  openIds[f.dataset.id+"|"+g]=1;
  try{history.replaceState(null,"","#"+f.dataset.id)}catch(x){}
  if(window.innerWidth<=760){setTimeout(function(){f.scrollIntoView({behavior:"smooth",block:"start"})},60)}
}

/* ---------- events ---------- */
document.addEventListener("click",function(ev){
  var t=ev.target,b=t.closest("button,a");
  if(!b)return;
  var d=b.dataset;
  if(d.group){S.group=d.group;render();return}
  if(d.year){S.year=d.year==="all"?"all":+d.year;render();return}
  if(d.type){S.type=d.type;render();return}
  if(d.kw){S.kw=S.kw===d.kw?"all":d.kw;render();return}
  var f=b.closest(".f");
  if(d.act==="random"){
    var l=list();if(!l.length)return;
    var e=l[Math.floor(Math.random()*l.length)];
    var fe=document.querySelector('.f[data-id="'+e.id+'"]');
    if(fe){openFolder(fe);fe.scrollIntoView({behavior:"smooth",block:"center"})}
    return}
  if(!f)return;
  if(b.classList.contains("strip")){openFolder(f);return}
  if(d.act==="orig"){
    var box=b.nextElementSibling,on=box.hidden;box.hidden=!on;box.classList.toggle("on",on);
    b.setAttribute("aria-expanded",on?"true":"false");b.querySelector(".l2").textContent=on?"접기":(box.children.length+"개 열기");return}
  if(d.act==="share"){
    var url=location.href.split("#")[0]+"#"+f.dataset.id,old=b.textContent;
    try{navigator.clipboard.writeText(url).then(function(){b.textContent="복사했어요"},function(){b.textContent="주소창의 링크를 복사해 주세요"})}catch(x){b.textContent="주소창의 링크를 복사해 주세요"}
    setTimeout(function(){b.textContent=old},1800);return}
});
document.addEventListener("input",function(ev){if(ev.target.id==="q"){S.q=ev.target.value.trim();render()}});
document.addEventListener("keydown",function(ev){
  var st=ev.target.closest&&ev.target.closest(".strip");
  if(st&&(ev.key==="ArrowLeft"||ev.key==="ArrowRight")){
    var row=st.closest(".row"),fs=[].slice.call(row.querySelectorAll(".f")),i=fs.indexOf(st.closest(".f"))+(ev.key==="ArrowRight"?1:-1);
    if(fs[i]){openFolder(fs[i]);fs[i].querySelector(".strip").focus();ev.preventDefault()}}
});
/* pointer: spotlight on folders + background parallax */
document.addEventListener("pointermove",function(ev){
  var r=document.documentElement;
  r.style.setProperty("--px",(ev.clientX/innerWidth-.5).toFixed(3));r.style.setProperty("--py",(ev.clientY/innerHeight-.5).toFixed(3));
  var f=ev.target.closest&&ev.target.closest(".f:not(.open)");
  if(f){var b=f.getBoundingClientRect();f.style.setProperty("--mx",(ev.clientX-b.left)+"px");f.style.setProperty("--my",(ev.clientY-b.top)+"px")}
});
document.getElementById("theme").addEventListener("click",function(){
  var r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme=dark?"light":"dark"});

/* deep link: #e12 opens that activity */
render();
(function(){
  var h=(location.hash||"").slice(1),e=byId[h];
  if(e){var f=document.querySelector('.f[data-id="'+h+'"]');if(f){openFolder(f);setTimeout(function(){f.scrollIntoView({block:"center"})},300)}}
})();
</script>
</body>
</html>
